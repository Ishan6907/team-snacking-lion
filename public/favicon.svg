<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sovereign Deep Navy Background -->
  <rect width="64" height="64" rx="14" fill="#0b2545"/>
  <!-- Gold Institutional Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#d97706" stroke-width="1.8" stroke-opacity="0.85"/>
  <!-- Top Saffron Accent -->
  <line x1="16" y1="12" x2="48" y2="12" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <!-- Architraval Pediment -->
  <polygon points="32,15 50,24 14,24" fill="#f8fafc" opacity="0.95"/>
  <!-- Three Institutional Pillars -->
  <rect x="18" y="26" width="6" height="20" rx="1.5" fill="#cbd5e1"/>
  <rect x="29" y="25" width="6" height="22" rx="1.5" fill="#f8fafc"/>
  <rect x="40" y="26" width="6" height="20" rx="1.5" fill="#cbd5e1"/>
  <!-- Golden Measurement Datum -->
  <circle cx="32" cy="36" r="2" fill="#d97706"/>
  <!-- Heavy Plinth -->
  <rect x="12" y="48" width="40" height="3.5" rx="1.5" fill="#e2e8f0"/>
  <rect x="10" y="52" width="44" height="3" rx="1" fill="#d97706" opacity="0.9"/>
  <!-- Bottom Green Accent -->
  <line x1="20" y1="58" x2="44" y2="58" stroke="#15803d" stroke-width="1.8" stroke-linecap="round"/>
</svg>

